<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="signup.css">

</head>
<body>
    <div class="container flex">
        <div class="left-section">
            <img src="images/login-image.svg" alt="" class="login-image">
        </div>
        <form action=""  name="loginform"></form>
            <div class="right-section flex-column">

                    <div>
                        <h1>Sign Up</h1>
                        <p class="note">Complete all the required fields in the form</p>
                    </div>
                    <div class="flex-column input-field">  
                        <p id="error"></p>
                        <input type="text" id="username" name="username" placeholder="Username">
                        <input type="email" id="email" name="email" placeholder="Email">
                        <input type="password" id="password"  placeholder="Password">
                        <input type="password" id="confirm-password"  placeholder="Confirm Password">
                    </div>
                    <div>
                        <button class="signup-btn" onclick="signup()">Sign Up</button>
                    </div>
                    <div class="signup">
                        <p >Already have an account?  <a href="login.html">Sign In</a></p>
                    </div>
            
            </div>
        </form>
    </div>
    <script src="signup.js"></script>
</body>
</html>
