<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Quiz</title>
    <link rel="stylesheet" href="javaquiz.css">
    <link rel="stylesheet" href="/Quiz_app/home.css">
</head>
<body onload="startquiz()">
    <div class="nav-container">
        
        <div class="logo">
            <img src="/Quiz_app/images/icon.png" alt="" width="100%">
        </div>

        <div class="btn">
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

    </div>
    <div class="quiz-container" >
        <div class="top">
            <div class="counter">
                <p>Question</p>
                <p id="question-counter">1/3</p>
            </div>
            <div class="score">
                <p>Score</p>
                <p id="score-number">0</p>
            </div>
        </div>
        <div class="question-box">
            <h2 class="question">What is your name?</h2>
        </div>

        <div class="choice-container" id="1">
            <p class="choice">A</p>
            <p class="choice-text">Choice A</p>
        </div>
        <div class="choice-container" id="2">
            <p class="choice">B</p>
            <p class="choice-text">Choice B</p>
        </div>
        <div class="choice-container" id="3">
            <p class="choice">C</p>
            <p class="choice-text">Choice C</p>
        </div>
        <div class="choice-container" id="4">
            <p class="choice">D</p>
            <p class="choice-text">Choice D</p>
        </div>
        
        <div class="next-btn">
            <button class="" onclick=" updateScore(); startquiz()">Next</button>
        </div>

    </div>
    

    <script src="javaquiz.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
